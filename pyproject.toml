[project]
name = "PocketLM"
version = "0.1.0"
description = "PocketLM is a lightweight, low-latency language model optimized for edge deployment and micro-tasks. Built specifically to bypass the overhead of massive foundational models, it delivers fast, reliable performance for high-volume, single-turn tasks like data classification, entity extraction, and text summarization. Minimal VRAM, maximum utility."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.137.1",
    "httpx>=0.28.1",
    "langchain-core>=1.4.7",
    "langgraph>=1.2.5",
    "pytest>=9.1.0",
    "uvicorn>=0.49.0",
]
